name: ai_diary_hands_on
description: "書籍「作って学ぶ生成AIモバイルアプリ開発／運用ーFirebase AI LogicとGenkitでFlutterアプリにGeminiを実装する」のAI日記アプリハンズオンのサンプルコード"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  adaptive_dialog: ^2.8.0
  cloud_firestore: ^6.6.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  firebase_ai: ^3.14.1
  firebase_core: ^4.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_widget_from_html: ^0.17.2
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_converter_helper: ^0.1.6
  riverpod_annotation: ^3.0.3
  simple_logger: ^1.10.0
  tsuruo_kit: ^0.3.0

dev_dependencies:
  build_runner: ^2.15.0
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  go_router_builder: ^4.1.1
  icons_launcher: ^3.1.0
  json_serializable: ^6.11.2
  pedantic_mono: ^1.37.0
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/icon/

icons_launcher:
  image_path: "assets/images/icon/app_icon.png"
  platforms:
    android:
      enable: true
      adaptive_foreground_image: "assets/images/icon/app_icon.png"
      adaptive_background_image: "assets/images/icon/app_adaptive_background.png"
      notification_image: "assets/images/icon/app_icon.png"
      # adaptive_monochrome_image: "assets/images/icon/app_adaptive_monochrome.png"
    ios:
      enable: true
